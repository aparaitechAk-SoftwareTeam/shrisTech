name: bbs_gold
description: "A new Flutter project."
publish_to: 'none'
version: 4.0.0+3

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  google_fonts: ^6.2.1
  http: ^1.2.2
  cached_network_image: ^3.4.1
  image_cropper: ^12.2.1
  image_picker: ^1.2.3
  path: ^1.9.1
  shared_preferences: ^2.3.2
  shimmer: ^3.0.0
  url_launcher: ^6.3.2
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  permission_handler: 12.0.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/BSSGoldLogo1.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  
flutter:
  uses-material-design: true
  assets:
    - assets/BSSGoldLogo.png
    - assets/BSSGoldLogo1.png
